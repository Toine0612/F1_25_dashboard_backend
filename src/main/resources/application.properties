spring.application.name=demo
spring.datasource.url=jdbc:postgresql://localhost:5432/local_db
spring.datasource.username=local_user
spring.datasource.password=local_password
# This tells Hibernate to automatically create your database tables based on your Java code
spring.jpa.hibernate.ddl-auto=create
# Logs the SQL queries Hibernate executes so you can see what is happening
udp.telemetry.port=20777
udp.telemetry.bind-address=

# 1. Disable the basic SQL query printing to the console
spring.jpa.show-sql=false

# 2. Disable SQL formatting and comments (if show-sql was manually forced elsewhere)
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# 3. Suppress Hibernate's internal SQL logging via Spring Boot's logging levels
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN