spring.application.name=demo

# --- Database -------------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/local_db
spring.datasource.username=local_user
spring.datasource.password=local_password

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks that the
# entities still match it. Everything lives in its own "f1" schema so it never collides with the
# tables the previous ddl-auto=update setup left behind in "public".
spring.flyway.schemas=f1
spring.flyway.default-schema=f1
spring.jpa.properties.hibernate.default_schema=f1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# One lap is one lap row + one row per telemetry channel - send those channel rows in a single batch.
spring.jpa.properties.hibernate.jdbc.batch_size=32
spring.jpa.properties.hibernate.order_inserts=true

# --- UDP telemetry ingest -------------------------------------------------------------------
# Must match the port set in F1 25 > Settings > Telemetry Settings (UDP Format must be 2025).
udp.telemetry.port=20777
# Leave empty to listen on all interfaces (needed when the game runs on a console on the LAN).
udp.telemetry.bind-address=

# --- HTTP -----------------------------------------------------------------------------------
# A lap trace is a few hundred KB of JSON numbers; gzip shrinks that by ~3-4x.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2KB

logging.level.org.hibernate.SQL=WARN
